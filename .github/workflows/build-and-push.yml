name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute tag variables
        env:
          BRANCH_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          # Sanitize branch name to valid docker tag component
          BRANCH_TAG="$(echo "$BRANCH_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^[^a-z0-9_]+//; s/[^a-z0-9_]+$//')"
          if [ -z "$BRANCH_TAG" ]; then
            BRANCH_TAG="unknown"
          fi
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=$BRANCH_TAG" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ env.BRANCH_TAG }}-${{ env.SHORT_SHA }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Prepare build version metadata
        run: |
          echo "NOCTUA_BUILD_HASH=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "NOCTUA_BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NOCTUA_BUILD_HASH=${{ env.NOCTUA_BUILD_HASH }}
            NOCTUA_BUILD_TIME=${{ env.NOCTUA_BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"
