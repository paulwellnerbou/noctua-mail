name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the built Docker image to GHCR
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUN_VERSION: 1.3.12

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute tag variables
        env:
          BRANCH_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          # Sanitize branch name to valid docker tag component
          BRANCH_TAG="$(echo "$BRANCH_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^[^a-z0-9_]+//; s/[^a-z0-9_]+$//')"
          if [ -z "$BRANCH_TAG" ]; then
            BRANCH_TAG="unknown"
          fi
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=$BRANCH_TAG" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:ci

      - name: Run test stress pass
        run: bun run test:stress

      - name: Run Docker worker packaging check
        run: bun run test:docker-workers

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine push policy
        id: push-policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PUSH_IMAGE_INPUT: ${{ github.event.inputs.push_image || 'false' }}
        run: |
          SHOULD_PUSH=false

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            SHOULD_PUSH=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$PUSH_IMAGE_INPUT" = "true" ]; then
            SHOULD_PUSH=true
          fi

          echo "should_push=$SHOULD_PUSH" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        if: ${{ steps.push-policy.outputs.should_push == 'true' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ env.BRANCH_TAG }}-${{ env.SHORT_SHA }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Prepare build version metadata
        run: |
          echo "NOCTUA_BUILD_HASH=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "NOCTUA_BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"

      - name: Build and optionally push Docker image
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.push-policy.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NOCTUA_BUILD_HASH=${{ env.NOCTUA_BUILD_HASH }}
            NOCTUA_BUILD_TIME=${{ env.NOCTUA_BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        if: ${{ steps.push-policy.outputs.should_push == 'true' }}
        run: echo "Image pushed with digest ${{ steps.docker-build.outputs.digest }}"

      - name: Image push skipped
        if: ${{ steps.push-policy.outputs.should_push != 'true' }}
        run: echo "Docker image build completed without pushing to GHCR"
